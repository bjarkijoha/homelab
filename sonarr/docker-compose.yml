services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Atlantic/Reykjavik
    volumes:
      - /opt/docker/sonarr/config:/config
      - /storage/shows:/shows
      - /home/plexy/Media/Pending:/downloads
    ports:
      - 8989:8989
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
