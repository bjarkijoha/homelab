services:
  samba:
    image: crazymax/samba:latest
    container_name: samba
    ports:
      - "445:445"               # SMB over TCP; LAN only, not in the Cloudflare tunnel
    environment:
      - TZ=Atlantic/Reykjavik
      - SAMBA_SERVER_STRING=Plexy
    volumes:
      - /opt/docker/samba/data:/data                # Samba's cache and runtime state
      - ./config.yml:/data/config.yml:ro            # users and shares
      # rslave: ZFS mounts a snapshot under .zfs/snapshot on the host when it's
      # first opened. Without propagation the container can't see that mount
      # ("Symbolic link loop"), and Previous Versions can't open old files.
      - type: bind
        source: /storage/videos
        target: /samba/videos
        bind:
          propagation: rslave
    secrets:
      - samba_password
    restart: unless-stopped

secrets:
  samba_password:
    environment: SAMBA_PASSWORD
