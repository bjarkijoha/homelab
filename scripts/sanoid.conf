# Sanoid: automatic ZFS snapshots of the Samba video share. Anything deleted or
# overwritten from the workstation can be restored for a week: from Windows
# via Properties → Previous Versions, or from /storage/videos/.zfs/snapshot.
# Snapshots only use space for data that has since been deleted or changed.
# Install:
#   sudo apt install sanoid
#   sudo install -Dm644 scripts/sanoid.conf /etc/sanoid/sanoid.conf
# The package's sanoid.timer runs every 15 minutes, takes due snapshots and
# prunes expired ones.

[storage/videos]
        use_template = week

[template_week]
        frequently = 0
        hourly = 24
        daily = 7
        weekly = 0
        monthly = 0
        yearly = 0
        autosnap = yes
        autoprune = yes
