# Docker drop-in: don't start containers until the ZFS datasets are mounted.
# zfs-mount.service succeeds even when the pool failed to import, and
# RequiresMountsFor= can't help either: ZFS mounts have no fstab entry, so
# systemd only orders after them, and drops the dependency entirely when the
# pool is missing. The asserts check the real mounts at start time. If one is
# missing, Docker fails to start instead of running containers against empty
# folders on the OS disk.
# Install:
#   sudo install -Dm644 scripts/docker-zfs.conf /etc/systemd/system/docker.service.d/override.conf
#   sudo systemctl daemon-reload
[Unit]
After=zfs-import.target zfs-mount.service
Requires=zfs-import.target zfs-mount.service
AssertPathIsMountPoint=/storage/shows
AssertPathIsMountPoint=/storage/photos
AssertPathIsMountPoint=/storage/movies
