# Docker drop-in: don't start containers until the ZFS datasets are mounted.
# zfs-mount.service succeeds even when the pool failed to import, so the
# mounts themselves are required. If they're missing, Docker stays down
# instead of starting containers against empty folders on the OS disk.
# Install:
#   sudo install -Dm644 scripts/docker-zfs.conf /etc/systemd/system/docker.service.d/override.conf
#   sudo systemctl daemon-reload
[Unit]
After=zfs-import.target zfs-mount.service
Requires=zfs-import.target zfs-mount.service
RequiresMountsFor=/storage/shows /storage/photos /storage/movies
