services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Atlantic/Reykjavik
      - USER=${TRANSMISSION_USER}
      - PASS=${TRANSMISSION_PASS}
    volumes:
      - /opt/docker/transmission/config:/config
      - /home/plexy/Media/Pending:/downloads
      - /home/plexy/Media/Pending:/watch
      - /home/plexy/Media/Teiknimyndir:/Cartoons
      - /home/plexy/Media/Skripo:/Skripo
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
